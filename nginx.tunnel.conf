# =============================================================================
# AUREVO — edge nginx for Cloudflare Flexible SSL tunnel
#
# Cloudflare terminates TLS externally and sends plain HTTP to the origin.
# This config:
#   * Listens on :80 ONLY (no 443, no TLS, no HTTP→HTTPS redirect)
#   * Enforces security headers (no HSTS — Cloudflare sets its own)
#   * CSP allows Razorpay checkout widget (script, connect, frame)
#   * Routes /api/* -> api:4000 and /* -> web:80 (SPA)
#
# Mounted at /etc/nginx/nginx.conf inside the edge nginx container via
# docker-compose.tunnel.yml override.
#
# NOTE on nginx semantics: a location that defines its own `add_header`
# REPLACES (does not inherit) the headers from enclosing contexts. So the
# security headers below are repeated in any location that adds Cache-Control.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never leak the nginx version in Server: headers or error pages.
    server_tokens off;

    # Request limits at the edge: reject oversized bodies / slow clients early.
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    # Docker embedded DNS: re-resolve container hostnames every 10s instead of
    # caching their IPs at startup, so container restarts / rebuilds / IP changes
    # are picked up without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- CSP directive: allowed Razorpay checkout domains ----
    # script-src:  'self' + Razorpay checkout script
    # connect-src: 'self' + Razorpay API + checkout widget
    # frame-src:   Razorpay checkout iframe
    # style-src:   'self' + unsafe-inline (recharts, Razorpay widget)
    # img-src:     'self' + data: + any https: (product images)
    # Everything else: strict same-origin defaults
    # No upgradeInsecureRequests (origin is HTTP; Cloudflare handles TLS)
    # No HSTS (Cloudflare sets its own; not applicable to plain HTTP origin)

    # =====================================================================
    # HTTP server — serves content directly (Cloudflare terminates TLS)
    # =====================================================================
    server {
        listen 80;
        server_name Aurevo.buzz www.Aurevo.buzz;

        # API: keep the full /api path and forward the raw body unchanged
        # (Razorpay webhooks HMAC the exact bytes sent).
        location /api/ {
            # Variable proxy_pass so Docker DNS re-resolves after container rebuilds.
            # No URI path on the variable → original request URI is forwarded
            # (/api/health still reaches Nest as /api/health).
            set $api_upstream http://api:4000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            # Never cache API responses (fresh orders/auth state).
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # HTML must always be revalidated so new deploys are picked up fast;
        # hashed /assets/ are cached hard by the web container's own nginx.
        # These locations set their own add_header, so re-state the security
        # headers here (nginx does not inherit them).
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com https://accounts.google.com https://accounts.google.com; frame-src https://checkout.razorpay.com https://api.razorpay.com https://accounts.google.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
always;
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
        }
        location = / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com https://accounts.google.com https://accounts.google.com; frame-src https://checkout.razorpay.com https://api.razorpay.com https://accounts.google.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
 always;
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
        }
# Public sitemap: expose the raw XML generated by the API.
location = /sitemap.xml {
    proxy_pass http://api:4000/api/sitemap/xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
        # Everything else -> the SPA.
        # Must repeat security headers here (nginx does NOT inherit add_header from
        # parent or other locations). Without them, /checkout and other SPA routes
        # are served with no CSP — the API's Helmet CSP (frame-src 'none') then
        # blocks the Razorpay checkout iframe.
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com https://accounts.google.com https://accounts.google.com; frame-src https://checkout.razorpay.com https://api.razorpay.com https://accounts.google.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}