# AUREVO Web — static SPA server (internal container only).
#
# This nginx only serves the built frontend. TLS termination, security headers
# and reverse proxying to the API are handled by the edge nginx container (see
# the root nginx.conf + docker-compose.prod.yml), which is why the responses
# here stay minimal.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed static assets are immutable and safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # robots.txt / favicon are stable, short TTL.
    location = /robots.txt { expires 1d; }
    location = /favicon.svg { expires 1d; }

    # SPA fallback — unknown paths hand control to client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
