# =============================================================================
# AUREVO — CI
#
# Runs on every push to main and every pull request:
#   1. Lint, build and run the full test suite (unit + e2e). The e2e suite is
#      hermetic (it builds its own SQLite DB from the versioned migrations), so
#      no service containers are required.
#   2. Build both production Docker images to prove the multi-stage Dockerfiles
#      (API + web) actually compile in a clean environment.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build & test
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + compile all workspaces)
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e

  docker:
    name: Build production images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t aurevo-api:ci .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t aurevo-web:ci .
