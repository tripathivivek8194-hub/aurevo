# =============================================================================
# AUREVO — edge nginx (reverse proxy + TLS termination)
#
# Sits in front of the static `web` container and the `api` service (both
# defined in docker-compose.prod.yml). Terminates TLS, enforces security
# headers, compresses responses, and routes:
#   /api/*  -> http://api:4000    (NestJS; the /api prefix is preserved)
#   /*      -> http://web:80      (Vite SPA, static files)
#
# Mounted at /etc/nginx/nginx.conf inside the edge nginx container.
#
# NOTE on nginx semantics: a location that defines its own `add_header`
# REPLACES (does not inherit) the headers from enclosing contexts. So the
# security headers below are repeated in any location that adds Cache-Control.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never leak the nginx version in Server: headers or error pages.
    server_tokens off;

    # Request limits at the edge: reject oversized bodies / slow clients early.
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    # Docker embedded DNS: re-resolve container hostnames every 10s instead of
    # caching their IPs at startup, so container restarts / rebuilds / IP changes
    # are picked up without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- shared security headers (HTTPS block only; HTTP block redirects) ----

    # =====================================================================
    # HTTP server — 301 redirect to HTTPS
    # =====================================================================
    server {
        listen 80;
        server_name aurevo.buzz www.aurevo.buzz;
        return 301 https://www.aurevo.buzz$request_uri;
    }

    # =====================================================================
    # HTTPS server — active once certs are in ./certs/
    # =====================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name aurevo.buzz www.aurevo.buzz;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Redirect-only return is safe in server context; preserve path and query.
        if ($host = aurevo.buzz) { return 301 https://www.aurevo.buzz$request_uri; }

        # HSTS — only sent over HTTPS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP for the SPA document: connect-src 'self' covers the same-origin
        # /api calls; images may come from self, data: or any https host
        # (product images); style-src allows inline styles (recharts, etc.).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # API: keep the full /api path and forward the raw body unchanged
        # (Razorpay webhooks HMAC the exact bytes sent).
        location /api/ {
            # Variable proxy_pass so Docker DNS re-resolves after container rebuilds.
            # No URI path on the variable → original request URI is forwarded
            # (/api/health still reaches Nest as /api/health).
            set $api_upstream http://api:4000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            # Never cache API responses (fresh orders/auth state).
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # HTML must always be revalidated so new deploys are picked up fast;
        # hashed /assets/ are cached hard by the web container's own nginx.
        # These locations set their own add_header, so re-state the security
        # headers here (nginx does not inherit them).
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
        }
        location = / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
        }

        # Keep the sitemap independent from API availability so search engines
        # can always fetch it through the public edge.
        location = /sitemap.xml {
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else -> the SPA.
        location / {
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
