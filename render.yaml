services:
  - type: web
    name: aurevo-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: ALIEXPRESS_APP_KEY
        sync: false
      - key: ALIEXPRESS_APP_SECRET
        sync: false
      - key: ALIEXPRESS_ACCESS_TOKEN
        sync: false
      - key: ENABLE_STOCK_SYNC
        value: "true"
      - key: ENABLE_FULL_CATALOG_SYNC
        value: "false"
      - key: STOCK_SYNC_INTERVAL_MINUTES
        value: "30"
      - key: STOCK_SYNC_BATCH_SIZE
        value: "20"
      - key: INDIAMART_CRM_ID
        sync: false
      - key: INDIAMART_API_KEY
        sync: false
